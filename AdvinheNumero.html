<script>
  const num = Math.floor(Math.random() * 100) + 1;
  let palpite = 0;

  while (palpite !== num){
    palpite = Number(prompt("adivinhe o numero de 0 a 100"))

      if (palpite < num){
      alert("maior")
      }else if (palpite > num){
      alert("menor")
      }else if (palpite === num){
      alert ("você acertou o numero parabens")
      }
  }
</script>
